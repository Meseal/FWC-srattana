<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <h2>User Profile Card</h2>
        <table class="profile-table">
            <tr>
                <td>
                    <img class="avatar" src="https://tse1.mm.bing.net/th/id/OIP.dXHSbrrGoK-eaRS1DL-SxgHaGh?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Profile Picture">
                </td>
            </tr>
            <tr>
                <td class="login">Meee</td>
            </tr>
            <tr>
                <td class="desc">KMITL</td>
            </tr>
            <tr>
                <td class="socials">
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook">
                    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram">
                    <img src="https://img.magnific.com/free-vector/new-2023-twitter-logo-x-icon-design_1017-45418.jpg" alt="X">
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
